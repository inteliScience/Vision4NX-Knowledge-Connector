[project]
name = "vision4nx-kb-mcp"
version = "0.1.0"
description = "MCP server (streamable HTTP) exposing the Vision 4 NX / Open WebUI knowledge base as tools"
requires-python = ">=3.11"
dependencies = [
	# same SDK family as the Open WebUI 0.8.5 backend (pins mcp==1.26.0)
	"mcp>=1.26.0,<2",
	"httpx>=0.28",
	"uvicorn>=0.30",
	"pydantic-settings>=2.6",
]

[project.scripts]
vision4nx-kb-mcp = "vision4nx_kb_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision4nx_kb_mcp"]
