services:
  kb-mcp:
    build: .
    container_name: vision4nx-kb-mcp
    ports:
      - "8600:8600"
    env_file: .env
    restart: unless-stopped
    # lets OPENWEBUI_URL=http://host.docker.internal reach the host's nginx
    # (auto on Docker Desktop; this line is what makes it work on Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"

# To attach to the visionChatbot compose stack instead of exposing a host port:
# (verify the network name with `docker network ls`)
#
#    networks: [vision4nx]
#
# networks:
#   vision4nx:
#     external: true
#     name: visionchatbot_default
#
# then set OPENWEBUI_URL=http://vision4nx:8080 in .env (container-internal port)
